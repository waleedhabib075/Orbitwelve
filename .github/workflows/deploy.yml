name: Build and deploy to cPanel

on:
  push:
    # teams is the working branch that gets shipped; main has diverged and is
    # not what runs in production.
    branches: [teams]
  workflow_dispatch:

# Stop an in-flight deploy if a newer commit lands, so two uploads never
# interleave on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # react-simple-maps@3 declares a peer range that stops at React 18, so a
      # strict install refuses to resolve against React 19. The local
      # node_modules was installed the same way; this keeps CI consistent with
      # it rather than changing the dependency tree.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # contact-config.php is gitignored, so it is written here from secrets.
      # It must exist before the build: everything in public/ is copied into
      # out/ during `next build`.
      - name: Write contact form config
        env:
          MAIL_TRANSPORT: ${{ secrets.MAIL_TRANSPORT || 'php' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
        shell: bash
        run: |
          set -euo pipefail
          # Escape single quotes so a value can never break out of the PHP string.
          esc() { printf '%s' "${1//\'/\\\'}"; }

          cat > public/contact-config.php <<EOF
          <?php
          // Generated by GitHub Actions on each deploy. Editing this on the
          // server has no lasting effect — the next deploy overwrites it.
          // Change the repository secrets instead.
          return [
            'MAIL_TRANSPORT' => '$(esc "$MAIL_TRANSPORT")',
            'RESEND_API_KEY' => '$(esc "$RESEND_API_KEY")',
            'CONTACT_EMAIL_FROM' => '$(esc "$CONTACT_EMAIL_FROM")',
            'CONTACT_EMAIL_TO' => '$(esc "$CONTACT_EMAIL_TO")',
            'ALLOWED_ORIGINS' => [
              'https://orbitwelve.com',
              'https://www.orbitwelve.com',
            ],
          ];
          EOF

          if [ -z "$CONTACT_EMAIL_TO" ]; then
            echo "::error::CONTACT_EMAIL_TO secret is empty — the form would send to nobody."
            exit 1
          fi
          echo "Wrote public/contact-config.php (transport: $MAIL_TRANSPORT)"

      - name: Build static export
        env:
          # NEXT_PUBLIC_* values are compiled into the client bundle and are
          # already public on the live site, so they live here rather than in
          # secrets. Anything genuinely secret must never use this prefix.
          NEXT_PUBLIC_SANITY_PROJECT_ID: wzk5xhnv
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SUPABASE_URL: https://agvpzsrpyplikynriwqj.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFndnB6c3JweXBsaWt5bnJpd3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyMDc4NDksImV4cCI6MjA3Njc4Mzg0OX0.MLHLIJm9-gyY482f4wELjRYwqPL7bxY_dyKDlLJlO3M
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      # A deploy that silently drops .htaccess takes the whole site down with
      # 404s, so fail here rather than on the server.
      - name: Verify the export is complete
        run: |
          missing=0
          for f in out/.htaccess out/contact.php out/contact-config.php out/index.html; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty: $f"
              missing=1
            fi
          done
          if ! grep -q "AddHandler application/x-httpd-ea-php" out/.htaccess; then
            echo "::error::out/.htaccess lost the cPanel PHP handler"
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "All required deploy files present."
          exit $missing

      - name: Upload to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          # The example template has no reason to sit on a live server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/contact-config.example.php
